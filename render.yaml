services:
  - type: web
    name: board-field-project
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/bfp.db
    disk:
      name: bfp-data
      mountPath: /var/data
      sizeGB: 1
